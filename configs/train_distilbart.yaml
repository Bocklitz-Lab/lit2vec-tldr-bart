# configs/train_distilbart.yaml
# Training settings of the released model. Used by:  python src/train.py --config configs/train_distilbart.yaml
# Any key that is left out falls back to the default in src/train.py.

# ── Run / tracking ──────────────────────────────────────────────────────────────
project_name: "lit2vec_tldr_bart"
use_wandb: true               # false: no Weights & Biases logging (same as --no_wandb)
wandb_entity: null            # e.g. "your-team" or null for personal
run_name: "lit2vec_distilbart_run"
seed: 42

# ── Data / model ───────────────────────────────────────────────────────────────
dataset_id: "Bocklitz-Lab/lit2vec-tldr-bart-dataset"
model_checkpoint: "sshleifer/distilbart-cnn-12-6"

max_input_length: 1024
max_target_length: 128

# ── Paths ──────────────────────────────────────────────────────────────────────
tokenized_cache_path: "./saved_data/cached_tokenized_data"
checkpoint_dir: "./saved_data/checkpoints"
final_model_dir: "./saved_data/final_model"
evaluation_dir: "./evaluation"

# ── Training ───────────────────────────────────────────────────────────────────
train_batch_size: 4
eval_batch_size: 4
gradient_accumulation_steps: 4
learning_rate: 2e-5
num_train_epochs: 5
fp16: auto                     # "auto" lets the script set fp16 if CUDA is available

# ── Scheduling / logging ───────────────────────────────────────────────────────
logging_steps: 500
eval_steps: 1000
save_steps: 1000
save_total_limit: 2
evaluation_strategy: "steps"
save_strategy: "steps"
logging_strategy: "steps"

# ── Options that change the data or the objective ──────────────────────────────
# The values below reproduce the released model (see "Notes on the released model" in the README).
mask_label_padding: false      # true: padded label positions are ignored by the loss
drop_empty_pairs: false        # true: drop records without an abstract or without a summary
# max_train_samples: 64        # debugging only: use the first N records per split
# max_eval_samples: 32

# ── Device (optional) ──────────────────────────────────────────────────────────
# cuda_visible_devices: "0"    # uncomment to pin GPUs, or set via environment
